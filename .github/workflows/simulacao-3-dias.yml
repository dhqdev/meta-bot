# Temporário (só neste ramo): refaz 01/10, 02/10 e 05/10 com preços reais, regra atual x proposta.
name: Simulação dos últimos 3 dias

on:
  push:
    branches: [claude/project-thread-sq99v4]
    paths: ["backend/scripts/diagnosticar_entradas.py", ".github/workflows/simulacao-3-dias.yml"]

permissions:
  contents: read

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        regra: ["", "--proposta"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Refazer os dias
        working-directory: backend
        run: python scripts/diagnosticar_entradas.py --dia 2026-10-05 --dias 3 ${{ matrix.regra }}
